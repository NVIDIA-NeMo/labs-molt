# CICD Molt, the repository's one test workflow: the unit suite and a two-GPU asynchronous RL end-to-end run (recipe:
# tests/e2e/launch_scripts/Launch_RL_2GPU.sh) on one 2-GPU runner -- the unit tests run in a CPU-only
# container alongside the e2e, so they add no wall time. Ways in:
#   * Actions tab -> Run workflow: pick the branch, the multi-arch image (hijkzzz/molt) and the 2-GPU runner
#     (default: the arm64 GB200 runner the release image is built on).
#   * On a PR, fork or in-repo alike: a maintainer puts the `cicd` label on it. pull_request_target runs
#     THIS file from main with the repository's secrets and checks out the PR's head commit, so the label is the
#     approval that lets that exact revision run on a self-hosted GPU runner: read the diff first. The label is
#     removed as the run starts; a later push to the PR needs a fresh label.
#   * After every merge to main (push).
#   * Daily on main (schedule), only when main moved since the last successful run: catches drift in what
#     the code does not pin -- the `latest` image, the model and dataset on the Hub, the runner.
#   A failed push or daily run is reported to the CI Slack channel; nobody watches those.
# The image: the released one, unless the change under test (the PR's files, or the pushed range) touched the
# image's inputs -- dockerfile/, requirements.txt, pyproject.toml -- in which case it is built first, on the
# runner, from the release build cache (only the changed layers rebuild), and the run uses it.
# The checked-out tree is mounted over the image's copy. The result is the job's check on the PR, and every
# metric's first / last / min / max / change over the run is posted as the job summary (alerts fail the job).
name: CICD Molt

on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image (multi-arch tag; the runner's architecture is pulled)
        type: string
        default: hijkzzz/molt:latest
      runner:
        description: Runner label with 2 GPUs
        type: string
        default: nemo-ci-gcp-gpu-x2
  pull_request_target:
    types: [labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # daily, 10:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  pre-flight:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@cf5acebace78c7c339bc1f804357a991336f1c4d # v1.8.10
    with:
      default_runner_prefix: ${{ vars.DEFAULT_RUNNER_PREFIX }}
      non_nvidia_runner_prefix: ${{ vars.NON_NVIDIA_RUNNER_PREFIX }}
      default_test_data_path: ${{ vars.DEFAULT_TEST_DATA_PATH }}
      non_nvidia_test_data_path: ${{ vars.NON_NVIDIA_TEST_DATA_PATH }}
      sso_users_filename: ${{ vars.SSO_USERS_FILENAME }}
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}

  daily-gate:
    # A scheduled run is worth it only if main moved since the last run that passed; a failing main
    # keeps being retried every day until it passes.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cicd-main.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "last passing run: ${last:-none}; main: $GITHUB_SHA"
          echo "run=$([ "$last" != "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e-rl:
    needs: [pre-flight, daily-gate]
    if: |
      !cancelled() && needs.pre-flight.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'push'
          || github.event.label.name == 'cicd'
          || (github.event_name == 'schedule' && needs.daily-gate.outputs.run == 'true'))
    runs-on: ${{ inputs.runner || 'nemo-ci-gcp-gpu-x2' }}
    timeout-minutes: 120 # a change to the image's inputs rebuilds it first (warm cache ~10 min, cold ~1 h)
    steps:
      - name: Consume the trigger label
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number: context.payload.pull_request.number, name: 'cicd',
            }).catch(() => {});
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # pull_request_target checks out the base by default; test the PR's head commit instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Authenticated pull: the ephemeral runner fetches the image every run, and anonymous Docker Hub
      # pulls are rate-limited per IP.
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Runner resources
        run: |
          uname -m; nproc
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          echo "cgroup memory limit: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes)"
          free -g | head -2
          df -h "$GITHUB_WORKSPACE" /dev/shm
      - name: Resolve the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image || 'hijkzzz/molt:latest' }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The files under test: the PR's, or the pushed range's (the head commit alone on a new branch).
          case "$GITHUB_EVENT_NAME" in
            pull_request_target) q="repos/$GITHUB_REPOSITORY/pulls/$PR/files" ;;
            push) case "$BEFORE" in
                    ''|0000000000000000000000000000000000000000) q="repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" ;;
                    *) q="repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" ;;
                  esac ;;
            *) q="" ;;
          esac
          build=false
          # pulls/N/files answers with an array, compare and commits with {files: [...]}.
          if [ -n "$q" ] && gh api "$q" --paginate --jq 'if type == "array" then . else .files end | .[].filename' \
               | grep -qE '^(dockerfile/|requirements\.txt$|pyproject\.toml$)'; then
            build=true; IMAGE="molt-e2e:${GITHUB_SHA::8}"
          fi
          echo "image=$IMAGE build=$build"
          { echo "image=$IMAGE"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image (the change under test touched its inputs)
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          file: dockerfile/Dockerfile
          context: .
          load: true
          tags: ${{ steps.image.outputs.image }}
          # Read-only use of the release build cache for this runner's architecture.
          cache-from: type=registry,ref=hijkzzz/molt-buildcache:${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      - name: Unit tests, in a CPU-only container alongside the e2e
        run: |
          docker run -d --name unit --shm-size=8g --workdir /opt/labs-molt \
            --volume "${{ github.workspace }}:/opt/labs-molt" "${{ steps.image.outputs.image }}" \
            bash -lc 'pip install -q --target /tmp/pt pytest && PYTHONPATH=/tmp/pt python -m pytest -q -p no:cacheprovider tests/unit'
      - name: Async RL, Qwen2.5-Math-1.5B, 10 updates
        uses: ./.github/actions/test-template
        with:
          image: ${{ steps.image.outputs.image }}
          script: Launch_RL_2GPU
          script-dir: tests/e2e/launch_scripts
          timeout: "45"
          coverage-prefix: e2e
      - name: Unit test result
        if: always()
        run: |
          rc=$(docker wait unit 2>/dev/null || echo 1)
          docker logs unit 2>&1 | tail -30; docker rm -f unit >/dev/null 2>&1 || true
          [ "$rc" = 0 ]
      - name: Metrics summary
        if: always()
        run: |
          cat .tmp/e2e_rl_2gpu/metrics_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "No metrics: the run ended before the first update." >> "$GITHUB_STEP_SUMMARY"
      - name: Report a failed main run to Slack
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          WEBHOOK: ${{ secrets.SLACK_CI_CHANNEL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "SLACK_CI_CHANNEL_WEBHOOK not set"; exit 0; }
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"CICD Molt ${{ github.event_name }} run on main FAILED: $RUN_URL\"}" "$WEBHOOK"

  # The check branch protection requires. Reports only when the test job actually ran: a PR event that did
  # not carry the `cicd` label leaves the check at "Expected" instead of turning it green untested.
  Nemo_CICD_Test:
    needs: [e2e-rl]
    if: always() && !cancelled() && needs.e2e-rl.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "e2e-rl: ${{ needs.e2e-rl.result }}"
          [ "${{ needs.e2e-rl.result }}" = success ]
