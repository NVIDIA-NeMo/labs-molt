# CICD AutoModel-Slim, this branch's one test workflow, run the same way as CICD Molt. Ways in:
#   * Actions tab -> Run workflow: pick the branch, the molt image (hijkzzz/molt, multi-arch) and the 2-GPU runner.
#   * On a PR against automodel-slim, fork or in-repo alike: a maintainer puts the `cicd` label on it.
#     pull_request_target runs THIS file from the base branch with the repository's secrets and checks out the
#     PR's head commit, so the label is the approval that lets that exact revision run on a self-hosted GPU
#     runner: read the diff first. The label is removed as the run starts; a later push needs a fresh label.
#   * After every push to automodel-slim; a failed one is reported to the CI Slack channel.
# The image is molt's released one (this branch has no Dockerfile; molt bakes the pinned commit of this tree
# into its image, and the checkout under test is mounted over that copy). Three checks, ~10 minutes:
#   static   compileall, ruff, tools/check_closure.py (every import and every nemo_automodel.* string resolves)
#   unit     the Qwen / MoE / distributed / checkpoint / loading unit tests, in a CPU-only container
#            alongside the GPU smoke, so they add no wall time
#   smoke    tests/gpu_smoke/smoke.py on 2 GPUs: seeded few-layer Qwen2.5, Qwen3, Qwen3-MoE (EP2) and
#            Qwen3.6-MoE (EP2) built the way molt builds its actor. The consolidated HF export must load cleanly
#            into transformers, and for Qwen2.5 / Qwen3 / Qwen3-MoE that transformers model must reproduce the
#            forward logits within bf16 tolerance. Qwen3-MoE also runs a short training descent and a DCP
#            save / reload round trip.
name: CICD AutoModel-Slim

on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image (molt's multi-arch tag; the runner's architecture is pulled)
        type: string
        default: hijkzzz/molt:latest
      runner:
        description: Runner label with 2 GPUs
        type: string
        default: nemo-ci-gcp-gpu-x2
  pull_request_target:
    types: [labeled]
    branches: [automodel-slim]
  push:
    branches: [automodel-slim]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  pre-flight:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@cf5acebace78c7c339bc1f804357a991336f1c4d # v1.8.10
    with:
      default_runner_prefix: ${{ vars.DEFAULT_RUNNER_PREFIX }}
      non_nvidia_runner_prefix: ${{ vars.NON_NVIDIA_RUNNER_PREFIX }}
      default_test_data_path: ${{ vars.DEFAULT_TEST_DATA_PATH }}
      non_nvidia_test_data_path: ${{ vars.NON_NVIDIA_TEST_DATA_PATH }}
      sso_users_filename: ${{ vars.SSO_USERS_FILENAME }}
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}

  static:
    needs: [pre-flight]
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'cicd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q ruff
      - run: python -m compileall -q nemo_automodel tests tools
      - run: ruff check --select F821,F401,F822 nemo_automodel tests tools
      - run: python tools/check_closure.py nemo_automodel tests

  test:
    needs: [pre-flight]
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'cicd'
    runs-on: ${{ inputs.runner || 'nemo-ci-gcp-gpu-x2' }}
    timeout-minutes: 30
    env:
      IMAGE: ${{ inputs.image || 'hijkzzz/molt:latest' }}
    steps:
      - name: Consume the trigger label
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number: context.payload.pull_request.number, name: 'cicd',
            }).catch(() => {});
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # pull_request_target checks out the base by default; test the PR's head commit instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Authenticated pull: the ephemeral runner fetches the image every run, and anonymous Docker Hub
      # pulls are rate-limited per IP.
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker pull -q "$IMAGE"
      # `cd` explicitly: the image's login shell does not keep --workdir.
      - name: Unit tests, in a CPU-only container alongside the GPU smoke
        run: |
          docker run -d --name unit --shm-size=8g --workdir /src --volume "$GITHUB_WORKSPACE:/src" "$IMAGE" \
            bash -lc 'cd /src && pip install -q --target /tmp/pt pytest pytest-timeout && \
              PYTHONPATH=/src:/tmp/pt timeout 25m python -m pytest -q -p no:cacheprovider --timeout=600 \
                tests/unit_tests/models/qwen2 tests/unit_tests/models/qwen3 tests/unit_tests/models/qwen3_moe \
                tests/unit_tests/models/qwen3_next tests/unit_tests/models/qwen3_5 tests/unit_tests/models/qwen3_5_moe \
                tests/unit_tests/models/common tests/unit_tests/moe tests/unit_tests/distributed \
                tests/unit_tests/checkpoint tests/unit_tests/_transformers'
      # Triton (GDN) and Inductor (flex attention) kernels are JIT-compiled; the ephemeral runner would redo
      # that every run, so the cache dirs persist through actions/cache, keyed on runner arch and image.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: kcache
        with:
          path: ${{ github.workspace }}/.kcache
          key: kernels-${{ runner.arch }}-${{ env.IMAGE }}-v1
      # CUDNN_PATH / LD_LIBRARY_PATH pin TE to the bundled cuDNN, as molt's launch scripts do: the login shell
      # can shadow the image's ENV with the apt cuDNN, which breaks the fused-attention kernel.
      # Only qwen3_moe trains.
      - name: GPU smoke, reference parity on Qwen2.5 / Qwen3 / Qwen3-MoE / Qwen3.6; Qwen3-MoE trains + checkpoint round trip
        env:
          ARCHS: qwen2_5 qwen3 qwen3_moe qwen3_6
        run: |
          mkdir -p .kcache
          docker run --rm --gpus all --shm-size=16g --workdir /src --volume "$GITHUB_WORKSPACE:/src" -e ARCHS "$IMAGE" \
            bash -lc 'cd /src && nvidia-smi -L && python -c "import torch, transformer_engine as te; print(torch.__version__, te.__version__, torch.cuda.get_device_capability())" && \
              export NVTE_FUSED_ATTN=1 NVTE_FLASH_ATTN=0 CUDNN_PATH=/usr/local/lib/python3.12/dist-packages/nvidia/cudnn \
                     LD_LIBRARY_PATH=/usr/local/lib/python3.12/dist-packages/nvidia/cudnn/lib:${LD_LIBRARY_PATH:-} \
                     TRITON_CACHE_DIR=/src/.kcache/triton TORCHINDUCTOR_CACHE_DIR=/src/.kcache/inductor PYTHONPATH=/src && \
              for arch in $ARCHS; do echo "===== $arch"; EXTRA=""; [ "$arch" = qwen3_moe ] && EXTRA="--train"; \
                timeout 12m torchrun --nproc_per_node=2 tests/gpu_smoke/smoke.py --arch $arch $EXTRA || exit 1; \
              done'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.kcache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.kcache
          key: kernels-${{ runner.arch }}-${{ env.IMAGE }}-v1
      - name: Unit test result
        if: always()
        run: |
          rc=$(docker wait unit 2>/dev/null || echo 1)
          docker logs unit 2>&1 | tail -200; docker rm -f unit >/dev/null 2>&1 || true
          [ "$rc" = 0 ]
      - name: Report a failed branch run to Slack
        if: failure() && github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.SLACK_CI_CHANNEL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "SLACK_CI_CHANNEL_WEBHOOK not set"; exit 0; }
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"CICD AutoModel-Slim ${{ github.event_name }} run on automodel-slim FAILED: $RUN_URL\"}" "$WEBHOOK"

  # The check branch protection requires. Reports only when the jobs actually ran: a PR event that did
  # not carry the `cicd` label leaves the check at "Expected" instead of turning it green untested.
  Nemo_CICD_Test:
    needs: [static, test]
    if: always() && !cancelled() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static: ${{ needs.static.result }}  test: ${{ needs.test.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
