<!-- blog/ lists every entry in posts.js; blog/?p=<slug> renders posts/<slug>.md. See README.md here. -->

<script src="posts.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
(function () {
  var d = document, M = window.Molt, el = M.el, root = d.getElementById('blog-root');
  var slug = new URLSearchParams(location.search).get('p');
  var KATEX = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/';
  var KATEX_JS = 'sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg';
  var KATEX_CSS = 'sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+';
  function backLink() { var a = el('a', 'more back', 'All posts'); a.href = './'; return a; }

  if (!slug) {
    var head = el('div', 'blog-head'), grid = el('div', 'news-grid');
    head.appendChild(el('p', 'kicker', 'Molt'));
    head.appendChild(el('h1', null, 'News & Blog'));
    head.appendChild(el('p', 'sub', 'Releases, research notes, and deep dives.'));
    root.appendChild(head);
    root.appendChild(grid);
    M.render(grid, { base: '', cards: true });
    return;
  }

  // Only a file name inside posts/ is ever fetched, so ?p= cannot load other content.
  (/^[\w-]+$/.test(slug) ? fetch('posts/' + slug + '.md') : Promise.reject())
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(show, function () {
      var head = el('div', 'blog-head');
      head.appendChild(el('h1', null, 'Post not found'));
      head.appendChild(backLink());
      root.appendChild(head);
    });

  function show(md) {
    var meta = window.MOLT_POSTS.filter(function (p) { return p.slug === slug; })[0] || {};
    // The leading comment and "# Title" keep the file readable on GitHub; the page shows its own header.
    md = md.replace(/^\s*<!--[\s\S]*?-->\s*/, '');
    var h1 = md.match(/^#[ \t]+(.+)\n/);
    if (h1) md = md.slice(h1[0].length);

    // Lift math out before Markdown runs, so underscores and backslashes survive:
    // $inline$, $$display$$, and GitHub-style ```math fences. Code is left alone.
    var math = [];
    function keep(tex, display) {
      math.push({ tex: tex, display: display });
      var token = '@@MATH' + (math.length - 1) + '@@';
      return display ? '\n\n' + token + '\n\n' : token;
    }
    md = md.split(/(^```[^\n]*\n[\s\S]*?\n```[ \t]*$)/m).map(function (seg, i) {
      if (i % 2) {
        var fence = seg.match(/^```math[ \t]*\n([\s\S]*?)\n```[ \t]*$/);
        return fence ? keep(fence[1].trim(), true) : seg;
      }
      return seg.split(/(`[^`\n]*`)/).map(function (text, j) {
        if (j % 2) return text;
        return text
          .replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) { return keep(tex.trim(), true); })
          .replace(/(^|[^\\$\w])\$(?!\s)([^$\n]*?[^\s$\\])\$(?![\w$])/g, function (_, pre, tex) { return pre + keep(tex, false); });
      }).join('');
    }).join('');

    var article = el('article', 'article'), head = el('header', 'article-head');
    var info = el('p', 'meta'), prose = el('div', 'prose'), foot = el('footer', 'article-foot');
    var title = meta.title || (h1 ? h1[1] : slug);
    if (meta.tag) info.appendChild(el('span', 'tag', meta.tag));
    if (meta.date) info.appendChild(el('time', null, M.fmtDate(meta.date)));
    head.appendChild(backLink());
    head.appendChild(info);
    head.appendChild(el('h1', null, title));
    if (meta.summary) head.appendChild(el('p', 'dek', meta.summary));
    prose.innerHTML = window.marked.parse(md)
      .replace(/<p>\s*@@MATH(\d+)@@\s*<\/p>/g, '<div class="math-block" data-math="$1"></div>')
      .replace(/@@MATH(\d+)@@/g, '<span data-math="$1"></span>');
    foot.appendChild(backLink());
    article.appendChild(head);
    article.appendChild(prose);
    article.appendChild(foot);
    root.appendChild(article);
    d.title = title + ' · Molt Blog';

    // Resolve relative links and images against the Markdown file, so the same
    // paths work here and when the file is viewed on GitHub.
    var base = new URL('posts/' + slug + '.md', location.href);
    [].forEach.call(prose.querySelectorAll('[src], a[href]'), function (n) {
      var attr = n.hasAttribute('src') ? 'src' : 'href', v = n.getAttribute(attr);
      if (!/^([a-z][a-z0-9+.\-]*:|\/|#)/i.test(v)) n.setAttribute(attr, new URL(v, base).href);
      if (attr === 'href' && n.host !== location.host) { n.target = '_blank'; n.rel = 'noopener'; }
    });

    // KaTeX loads only for posts that contain math. Until it does, the TeX source shows.
    var nodes = [].slice.call(prose.querySelectorAll('[data-math]'));
    if (!nodes.length) return;
    nodes.forEach(function (n) { n.textContent = math[n.getAttribute('data-math')].tex; });
    var css = el('link'), js = el('script');
    css.rel = 'stylesheet'; css.href = KATEX + 'katex.min.css'; css.integrity = KATEX_CSS; css.crossOrigin = 'anonymous';
    js.src = KATEX + 'katex.min.js'; js.integrity = KATEX_JS; js.crossOrigin = 'anonymous';
    js.onload = function () {
      nodes.forEach(function (n) {
        var m = math[n.getAttribute('data-math')];
        window.katex.render(m.tex, n, { displayMode: m.display, throwOnError: false });
      });
    };
    d.head.appendChild(css);
    d.head.appendChild(js);
  }
})();
</script>
</body>
</html>
