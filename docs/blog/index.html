<!-- blog/ lists every entry in posts.js; blog/?p=<slug> renders posts/<slug>.md. See README.md here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Molt</title>
<meta name="description" content="News, releases, and research notes from Molt, a Hugging Face-native framework for agentic RL research.">

<meta property="og:type" content="website">
<meta property="og:title" content="Molt Blog">
<meta property="og:description" content="News, releases, and research notes from Molt.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="../" aria-label="Molt home">Molt</a>
    <nav aria-label="Sections">
      <ul class="nav-links">
        <li class="keep"><a href="./" aria-current="page">Blog</a></li>

    <div class="legal" style="border-top:0;padding-top:0">

<script src="posts.js"></script>
<script src="../assets/site.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
(function () {
  var d = document, M = window.Molt, el = M.el, root = d.getElementById('blog-root');
  var slug = new URLSearchParams(location.search).get('p');
  function backLink() { var a = el('a', 'more back', 'All posts'); a.href = './'; return a; }

  if (!slug) {
    var head = el('div', 'blog-head'), grid = el('div', 'news-grid');
    head.appendChild(el('p', 'kicker', 'Molt'));
    head.appendChild(el('h1', null, 'News & Blog'));
    head.appendChild(el('p', 'sub', 'Releases, research notes, and deep dives.'));
    root.appendChild(head);
    root.appendChild(grid);
    M.render(grid, { base: '', cards: true });
    return;
  }

  // Only a file name inside posts/ is ever fetched, so ?p= cannot load other content.
  (/^[\w-]+$/.test(slug) ? fetch('posts/' + slug + '.md') : Promise.reject())
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(show, function () {
      var head = el('div', 'blog-head');
      head.appendChild(el('h1', null, 'Post not found'));
      head.appendChild(backLink());
      root.appendChild(head);
    });

  function show(md) {
    var meta = window.MOLT_POSTS.filter(function (p) { return p.slug === slug; })[0] || {};
    // The leading comment and "# Title" keep the file readable on GitHub; the page shows its own header.
    md = md.replace(/^\s*<!--[\s\S]*?-->\s*/, '');
    var h1 = md.match(/^#[ \t]+(.+)\n/);
    if (h1) md = md.slice(h1[0].length);

    var article = el('article', 'article'), head = el('header', 'article-head');
    var info = el('p', 'meta'), prose = el('div', 'prose'), foot = el('footer', 'article-foot');
    var title = meta.title || (h1 ? h1[1] : slug);
    if (meta.tag) info.appendChild(el('span', 'tag', meta.tag));
    if (meta.date) info.appendChild(el('time', null, M.fmtDate(meta.date)));
    head.appendChild(backLink());
    head.appendChild(info);
    head.appendChild(el('h1', null, title));
    if (meta.summary) head.appendChild(el('p', 'dek', meta.summary));
    foot.appendChild(backLink());
    article.appendChild(head);
    article.appendChild(prose);
    article.appendChild(foot);
    root.appendChild(article);
    d.title = title + ' · Molt Blog';

    M.markdown(md, new URL('posts/' + slug + '.md', location.href), prose);
  }
})();
</script>
<script src="../guide/pages.js"></script>
<script src="../guide/search.js"></script>
</body>
</html>
