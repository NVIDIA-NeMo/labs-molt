<!-- guide/ lists every page in pages.js; guide/?p=<name> renders pages/<name>.md. See README.md here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs · Molt</title>
<meta name="description" content="Guides, deep dives, and reference for Molt, a Hugging Face-native framework for agentic RL research.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="Molt Docs">
<meta property="og:description" content="Guides, deep dives, and reference for Molt.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="../" aria-label="Molt home">Molt</a>
    <nav aria-label="Sections">
      <ul class="nav-links">
        <li class="keep"><a href="../blog/">Blog</a></li>
        <li class="keep"><a href="./" aria-current="page">Docs</a></li>
        <li><a href="../#architecture">Architecture</a></li>
        <li><a href="../#automodel">AutoModel</a></li>
        <li><a href="../#features">Features</a></li>
        <li><a href="../#quickstart">Quick Start</a></li>
      </ul>
    </nav>
    <button class="nav-search" type="button" data-search aria-label="Search the docs">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <g id="search-icon"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></g>
      </svg>
      <span>Search</span><kbd>⌘K</kbd>
    </button>
    <a class="nav-cta" href="https://github.com/NVIDIA-NeMo/labs-molt">GitHub</a>
  </div>

<footer class="footer">

      <span><a href="../">Molt</a> · <a href="https://github.com/NVIDIA-NeMo/labs-molt">GitHub</a> · <a href="https://www.researchgate.net/publication/409325071_Molt_A_Scalable_PyTorch-Native_Training_Framework_for_Agentic_Reinforcement_Learning">Technical report</a></span>
    </div>

<script src="pages.js"></script>
<script src="../assets/site.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
(function () {
  var d = document, M = window.Molt, el = M.el;
  var nav = d.getElementById('guide-nav'), root = d.getElementById('guide-root');
  var params = new URLSearchParams(location.search), slug = params.get('p');
  function key(text) { return text.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  function pageLink(page, cls) { var a = el('a', cls, page[1]); a.href = '?p=' + page[0]; return a; }

  // The sidebar lists every page. It starts open on wide screens, where it sits beside the text.
  var pages = [];
  window.MOLT_DOCS.forEach(function (group) {
    var list = el('ul');
    group.pages.forEach(function (page) {
      var item = el('li'), a = pageLink(page);
      if (page[0] === slug) a.setAttribute('aria-current', 'page');
      item.appendChild(a);
      list.appendChild(item);
      pages.push(page);
    });
    nav.appendChild(el('h4', null, group.section));
    nav.appendChild(list);
  });
  nav.open = window.matchMedia('(min-width: 900px)').matches;

  if (!slug) {
    root.appendChild(el('p', 'kicker', 'Molt'));
    root.appendChild(el('h1', 'docs-title', 'Documentation'));
    root.appendChild(el('p', 'sub', 'Guides, deep dives, and reference. The reference pages are generated from the source code.'));
    var field = root.appendChild(el('button', 'search-field'));
    field.type = 'button';
    field.setAttribute('data-search', '');
    field.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#search-icon"/></svg>' +
      '<span>Search the docs, or ask a question</span><kbd>⌘K</kbd>';
    window.MOLT_DOCS.forEach(function (group) {
      var grid = el('div', 'lib');
      group.pages.forEach(function (page) {
        var a = pageLink(page, 'lib-item');
        a.textContent = '';
        a.appendChild(el('h3', null, page[1]));
        a.appendChild(el('p', null, page[2]));
        grid.appendChild(a);
      });
      root.appendChild(el('h2', 'lib-head', group.section));
      root.appendChild(grid);
    });
    return;
  }

  // Only pages listed in pages.js are fetched, so ?p= cannot load other content.
  var at = pages.map(function (page) { return page[0]; }).indexOf(slug);
  (at < 0 ? Promise.reject() : fetch('pages/' + slug + '.md'))
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function (md) {
      var prose = el('div', 'prose'), pager = el('div', 'pager');
      root.appendChild(prose);
      M.markdown(md, new URL('pages/' + slug + '.md', location.href), prose);
      d.title = pages[at][1] + ' · Molt Docs';

      // Pages link to each other by file name, which also works on GitHub. Route those links here.
      [].forEach.call(prose.querySelectorAll('a[href$=".md"]'), function (a) {
        var name = a.pathname.split('/').pop().slice(0, -3);
        if (a.host === location.host) a.href = '?p=' + name;
      });

      // Longer pages get an "On this page" list of their sections.
      var sections = prose.querySelectorAll('h2'), toc = el('p', 'toc');
      [].forEach.call(sections, function (h) {
        var a = el('a', null, h.textContent);
        h.id = key(h.textContent);
        a.href = '#' + h.id;
        toc.appendChild(a);
      });
      if (sections.length > 2) prose.insertBefore(toc, prose.querySelector('h1').nextSibling);
      var target = d.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();

      // A search result names the heading or the table row to land on: ?p=<name>&at=<its text>.
      var landing = params.get('at');
      [].some.call(landing ? prose.querySelectorAll('h2, h3, td:first-child') : [], function (node) {
        if (key(node.textContent) !== key(landing)) return false;
        node = node.closest('tr') || node;
        node.classList.add('found');
        node.scrollIntoView({ block: node.tagName === 'TR' ? 'center' : 'start' });
        return true;
      });

      pager.appendChild(at > 0 ? pageLink(pages[at - 1], 'more back') : el('span'));
      if (at < pages.length - 1) pager.appendChild(pageLink(pages[at + 1], 'more'));
      root.appendChild(pager);
    }, function () {
      var back = el('a', 'more back', 'All docs');
      back.href = './';
      root.appendChild(el('h1', 'docs-title', 'Page not found'));
      root.appendChild(back);
    });
})();
</script>
<script src="search.js"></script>
</body>
</html>
